<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyster Dental - Navbar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="nav-logo">
                <img src="src/logo_full_fundo_azul.svg" alt="Oyster Dental Logo">
            </a>
            
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Serviços</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Equipe</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Oyster Dental Club</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Contato</a>
                </li>
            </ul>
            
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </nav>
    </header>

    <section class="home-hero">
        <div class="hero-content">
            <h1 class="hero-title">Protegemos<br><span class="typed-text"></span><span class="cursor">&nbsp;</span></h1>
            <img src="src/stars.png" alt="Estrelas decorativas" class="hero-stars">
        </div>
        <div class="hero-image">
            <img src="src/modelo_home.png" alt="Mulher sorrindo" class="model-img">
        </div>
    </section>
    
    <a href="https://wa.me/SEU_NUMERO_AQUI" class="whatsapp-button" target="_blank">
        <img src="src/whatsapp.svg" alt="Entrar em contato pelo WhatsApp" class="whatsapp-icon">
        <span class="whatsapp-text">Entre em contato</span>
    </a>

    <script src="script.js"></script>
</body>
</html>
